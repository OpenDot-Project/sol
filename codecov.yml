coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
comment:
  layout: 'diff, flags, files'
  require_changes: true
ignore:
  - 'tests/**'
fixes:
  - '/_/src/::'
