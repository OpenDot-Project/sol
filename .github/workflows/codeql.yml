name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }} manual build
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, cpp]
    permissions:
      contents: read
      security-events: write # Upload the CodeQL SARIF analysis result.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended
      - run: dotnet restore Sol.slnx --locked-mode
      - run: dotnet build Sol.slnx --no-restore --configuration Release
        if: matrix.language == 'csharp'
      - name: Build native launcher
        if: matrix.language == 'cpp'
        shell: pwsh
        run: ./eng/build-launcher.ps1
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
