name: Managed fuzz corpora

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: frontend-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay 40000 managed fuzz inputs
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify deterministic corpus regeneration
        run: |
          ./eng/new-frontend-fuzz-corpus.ps1 -Check
          ./eng/new-expanded-fuzz-corpus.ps1 -Check
      - name: Run isolated frontend and semantic corpus workers
        run: ./eng/test-fuzz.ps1 -Target managed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: managed-fuzz-reports
          path: out/fuzz/replay/
          if-no-files-found: warn
          retention-days: 7
