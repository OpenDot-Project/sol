name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Frontend (${{ matrix.configuration }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify private paths
        shell: pwsh
        run: ./eng/verify-repository.ps1
      - name: Locked restore
        run: dotnet restore Sol.slnx --locked-mode
      - name: Native asset acquisition regression tests
        if: matrix.configuration == 'Debug'
        run: ./eng/test-native-asset.ps1
      - name: Build and run regression tests
        if: matrix.configuration == 'Debug'
        run: dotnet test --solution Sol.slnx --no-restore --configuration Debug --report-xunit-trx --results-directory out/test-results/debug
      - name: Build and run tests with coverage
        if: matrix.configuration == 'Release'
        run: dotnet test --solution Sol.slnx --no-restore --configuration Release --coverlet --coverlet-output-format cobertura --report-xunit-trx --results-directory out/test-results/release
      - name: CLI process smoke tests
        shell: pwsh
        env:
          SOL_CONFIGURATION: ${{ matrix.configuration }}
        run: ./eng/test-cli.ps1 -Configuration $env:SOL_CONFIGURATION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: out/test-results/
          if-no-files-found: error
          retention-days: 14

  codecov:
    name: Codecov upload
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read # Download this run's coverage report; no repository code is executed here.
      contents: read
      id-token: write # Codecov OIDC authentication; this job never executes repository code.
    steps:
      - name: Coverage artifact download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download $env:RUN_ID --name test-results-Release --dir coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: coverage
          fail_ci_if_error: true
          flags: managed-frontend
          slug: ${{ github.repository }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number || '' }}
