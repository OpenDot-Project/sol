name: Doxygen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: doxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-api:
    name: Native API documentation validation
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./eng/test-doxygen.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doxygen-native-api
          path: |
            out/doxygen/html/
            out/doxygen/xml/
            out/doxygen/warnings.log
          if-no-files-found: error
          retention-days: 7
